services:
  ledgerflow:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ENABLE_OPENROUTER: ${ENABLE_OPENROUTER:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
    volumes:
      - ledgerflow-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  ledgerflow-data:
