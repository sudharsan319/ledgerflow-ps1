[project]
name = "ledgerflow"
version = "1.0.0"
description = "Explainable invoice processing with deterministic procurement decisions"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "pymupdf>=1.25,<2",
  "pypdf>=5,<7",
  "Pillow>=11,<13",
  "python-dotenv>=1,<2",
  "openpyxl>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
]
[dependency-groups]
dev = ["pytest>=8,<10"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
